# Weekly update PRs, grouped per ecosystem.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # typescript-eslint (in eslint-config-next) does not support TypeScript 7
      # yet, and eslint-config-next's React plugin crashes on ESLint 10. Lift
      # these when they do.
      - dependency-name: typescript
        versions: [">=6"]
      - dependency-name: eslint
        versions: [">=10"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
